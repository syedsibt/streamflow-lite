# StreamFlow Lite — Windows CI.
# Builds the Tauri v2 app on a GitHub-hosted Windows runner and uploads the
# NSIS installer (+ portable exe) as artifacts.
#
# Notes:
# - FFmpeg 6.1.1 (Gyan full-shared build: headers + import libs + DLLs) via
#   the FFMPEG_DIR env var that ffmpeg-sys-next understands. This matches the
#   FFmpeg 6.1 the engine was developed/verified against on Linux.
#   (vcpkg's FFmpeg 8.x was tried first: ffmpeg-sys-next 6.1.0 can't bind it
#   because libavcodec/avfft.h was removed upstream.)
# - v4l (Linux-only camera dep) is cfg-gated to Linux in sf-capture.
# - GPU tests cannot pass on the runner (no GPU) -> tests are non-blocking,
#   same as the v0.1.0 workflow. The .exe is the deliverable.
# - FFmpeg DLLs are staged into src-tauri/ffmpeg-dlls and injected into
#   bundle.resources (CI-only; local builds untouched). The JSON is written
#   WITHOUT a UTF-8 BOM (PowerShell 5.1's Set-Content -Encoding UTF8 adds one,
#   which the Tauri CLI cannot parse).
name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg 6.1.1 (dev files)
        run: |
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/6.1.1/ffmpeg-6.1.1-full_build-shared.7z" -OutFile "$env:TEMP\ffmpeg.7z"
          7z x "$env:TEMP\ffmpeg.7z" -o"C:\ffmpeg-tmp"
          $dir = Get-ChildItem "C:\ffmpeg-tmp" -Directory | Select-Object -First 1
          Move-Item $dir.FullName "C:\ffmpeg"
          "FFMPEG_DIR=C:\ffmpeg" >> $env:GITHUB_ENV
          # DLLs on PATH so test executables can load them at runtime.
          "C:\ffmpeg\bin" >> $env:GITHUB_PATH
          Get-ChildItem "C:\ffmpeg\include\libavcodec\avcodec.h"
          Get-ChildItem "C:\ffmpeg\lib\avcodec.lib"

      - name: Cargo test (workspace)
        # GPU tests need a real GPU; the runner has none. Non-blocking.
        # Results are surfaced as annotations (visible on the run page and
        # via the API) so failures are visible without downloading logs.
        run: |
          # The LUT integration test runs the gen-lut binary of another
          # workspace package, which `cargo test` does not build.
          cmd /c "cargo build -p gen-lut > build-genlut.log 2>&1"
          cmd /c "cargo test --workspace --no-fail-fast > test.log 2>&1"
          $code = $LASTEXITCODE
          $results = Select-String -Path test.log -Pattern '^test result:' | ForEach-Object { $_.Line }
          $failed = @(Select-String -Path test.log -Pattern '^test .* FAILED$|^error(\[|:)' | ForEach-Object { $_.Line })
          $passed = ($results | ForEach-Object { if ($_ -match '(\d+) passed') { [int]$Matches[1] } else { 0 } } | Measure-Object -Sum).Sum
          Write-Host "::notice title=cargo test summary::exit $code; $passed passed; $($failed.Count) failed/error lines"
          $failed | Select-Object -First 9 | ForEach-Object { Write-Host "::warning title=cargo test::$_" }
          # Panic messages (the line after "panicked at"), skipping the
          # expected no-GPU failures, as notices.
          $lines = Get-Content test.log
          $msgs = for ($i = 0; $i -lt $lines.Count - 1; $i++) {
            if ($lines[$i] -match "panicked at") { "$($lines[$i]) -> $($lines[$i + 1])" }
          }
          $msgs | Where-Object { $_ -notmatch "adapter|GPU|lavapipe|headless engine" } | Select-Object -First 9 | ForEach-Object { Write-Host "::notice title=panic::$_" }
          Get-Content test.log -Tail 40
          exit $code
        continue-on-error: true

      - name: Stage FFmpeg DLLs + wire into bundle
        run: |
          New-Item -ItemType Directory -Force -Path "apps\desktop\src-tauri\ffmpeg-dlls" | Out-Null
          # ALL FFmpeg DLLs (av*, sw*, postproc, …) — the loader reports them
          # one at a time, so a partial set just moves the error to the next.
          Copy-Item "C:\ffmpeg\bin\*.dll" "apps\desktop\src-tauri\ffmpeg-dlls\"
          $confPath = "apps\desktop\src-tauri\tauri.conf.json"
          $json = Get-Content $confPath -Raw | ConvertFrom-Json
          # Map each DLL to the bundle root so it lands NEXT TO the exe.
          # (A plain glob preserves the ffmpeg-dlls/ subfolder, which the
          # Windows loader does not search.)
          $res = @{}
          Get-ChildItem "apps\desktop\src-tauri\ffmpeg-dlls\*.dll" | ForEach-Object { $res["ffmpeg-dlls/$($_.Name)"] = $_.Name }
          $json.bundle | Add-Member -NotePropertyName "resources" -NotePropertyValue $res -Force
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($confPath, ($json | ConvertTo-Json -Depth 30), $utf8NoBom)
          Get-ChildItem "apps\desktop\src-tauri\ffmpeg-dlls\"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop

      - name: Zip portable exe with DLLs
        run: |
          New-Item -ItemType Directory -Force -Path "portable-dist" | Out-Null
          Copy-Item "apps\desktop\src-tauri\target\release\streamflow-lite-desktop.exe" "portable-dist\"
          Copy-Item "apps\desktop\src-tauri\ffmpeg-dlls\*.dll" "portable-dist\"
          Compress-Archive -Path "portable-dist\*" -DestinationPath "streamflow-lite-windows-x64-portable.zip" -Force

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: streamflow-lite-windows-x64-portable
          path: streamflow-lite-windows-x64-portable.zip

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: streamflow-lite-windows-x64-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: streamflow-lite-windows-x64-msi
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
