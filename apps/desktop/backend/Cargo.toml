[package]
name = "sf-ui-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless-testable engine bindings for the StreamFlow Lite Tauri+React shell (apps/desktop). No tauri dependency here — src-tauri is a thin adapter over this crate."

[dependencies]
sf-engine = { path = "../../../crates/sf-engine" }
sf-ipc = { path = "../../../crates/sf-ipc" }
sf-color = { path = "../../../crates/sf-color" }
sf-filters = { path = "../../../crates/sf-filters" }
sf-scopes = { path = "../../../crates/sf-scopes" }
sf-ai-color = { path = "../../../crates/sf-ai-color" }
sf-state = { path = "../../../crates/sf-state" }
sf-capture = { path = "../../../crates/sf-capture" }
sf-encode = { path = "../../../crates/sf-encode" }
sf-output = { path = "../../../crates/sf-output" }
sf-audio = { path = "../../../crates/sf-audio" }
sf-graphics = { path = "../../../crates/sf-graphics" }
# Local audio monitoring (speakers). cpal = cross-platform audio I/O
# (WASAPI on Windows, ALSA on Linux).
cpal = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
# PNG + JPEG encoding for preview/monitor frames (default-features off keeps
# it lean). Monitors use JPEG: ~10x smaller than PNG for camera frames, so a
# 10fps monitor poll stays cheap over IPC.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
serde_json = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(sf_wincheck)'] }
