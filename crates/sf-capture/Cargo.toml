[package]
name = "sf-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
ffmpeg-next = "6"

# v4l2 is Linux-only; its build script needs <linux/videodev2.h>.
# (Windows uses the mf_camera scaffold instead.)
[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
